name: CI

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: Build / Test / Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Verify build output
        run: |
          if [ ! -d "packages/wirecam/dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          if [ ! -f "packages/wirecam/dist/index.js" ]; then
            echo "❌ Build failed: index.js not found"
            exit 1
          fi
          if [ ! -f "packages/wirecam/dist/index.mjs" ]; then
            echo "❌ Build failed: index.mjs not found"
            exit 1
          fi
          if [ ! -f "packages/wirecam/dist/index.d.ts" ]; then
            echo "❌ Build failed: index.d.ts not found"
            exit 1
          fi
          echo "✅ Build verification passed"

      - name: Test package locally
        run: |
          cd packages/wirecam
          npm pack
          echo "✅ Package pack check passed"
